name: sunrise_signal
description: "An app for tracking and understanding morning wood."
publish_to: 'none'

version: 2.0.0+200

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^2.0.0
  provider: ^6.1.5
  table_calendar: ^3.3.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  local_auth: ^3.0.2
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
